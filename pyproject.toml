[project]
name = "topicjev-benchmark"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.5",
  "scipy==1.18.1",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "python-dotenv==1.2.4",
  "torch==2.15.0",
  "transformers==5.24.1",
  "huggingface-hub==2.4.0",
  "laya==0.3.11",
  "topicjev",
  "onnxruntime>=1.32.0",
  "mlx-lm>=0.32.2 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
  "matplotlib>=3.11.2",
]

[tool.uv.sources]
topicjev = { git = "https://github.com/anatems1/TopicJev", rev = "e271339027555160e1a9dc2efa8fc6e71b1a5475" }
